id: draft-producer
name: Draft Producer
type: agent
phase: implementation

action: >-
  Work through the brief and write the first complete draft it describes, adding nothing the brief
  does not ask for.
spec: >-
  A brief arrives with the run. Write the piece it describes, in full, as your first and only pass
  here. The brief is all you get, and that is the point: do not go looking for the conditions your
  draft will be graded against, do not reason about how it will be judged, and do not shape a
  sentence toward a check you imagine exists. Emit one complete draft on `draft` with no
  commentary, no covering note and no list of what you were unsure about. Where the brief is
  silent, make the ordinary choice and carry on rather than leaving a placeholder; a draft with a
  gap in it is not a complete draft. Say nothing about your own confidence anywhere in the output.
agent: Producer
tools: []
mcp: []
params: {}

inputs: []
outputs:
  - name: draft
    type: markdown
    description: One complete first draft of the work the brief describes, with nothing attached to it.
dependencies: []
cannot:
  - acceptance-criteria
will_not:
  - read the conditions its draft will be judged against

risk_markers: []
notes: >-
  The `cannot` entry is the load-bearing line on this card. It names an ontology data type, so an
  incoming edge carrying the rubric fails the bundle outright rather than being caught in review.

version: 1.0.0
author: autogen
