id: event-intake
name: Event Intake
type: tool

action: >-
  Accept an inbound event from the ticket queue or the alert bus, stamp it with a correlation id,
  and drop anything that repeats inside the dedupe window.
spec: >-
  Take the raw payload the ticket queue or the alert bus handed you and turn it into exactly one
  event record. Attach a correlation id that will stay with this item for the rest of the run,
  record which source it arrived on and the time it arrived, and leave the payload itself
  untouched — you normalise the envelope, never the contents. Compare the record against the ones
  you admitted in the last 120 seconds and admit nothing that repeats one of them: a duplicate is
  dropped here and emitted nowhere. Emit the admitted record on `event`, and treat yourself as
  done when either one record has gone out or the item has been dropped as a repeat.
tools: []
params:
  dedupe_window_s: 120
  sources:
    - ticket-queue
    - alert-bus

inputs: []
outputs:
  - name: event
    type: json
    description: The event as received, with its correlation id and arrival time attached.
dependencies: []

requires_human: false
risk_markers: []
notes: >-
  A support ticket and a production alert are the same shape at this boundary — payload, source,
  timestamp — which is why both support lines start here. No `lupo/pii-handling` marker: a shared
  card may only claim the risks that hold in every blueprint pinning it, and an alert payload
  carries none.

version: 1.0.0
author: hachi
ontology_version: 0.1.0
