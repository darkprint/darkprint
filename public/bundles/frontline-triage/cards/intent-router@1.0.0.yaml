id: intent-router
name: Intent Router
type: decision

action: >-
  Classify the inbound event against the label set and dispatch it down the matching lane,
  falling through to the default lane whenever confidence sits below the threshold.
spec: >-
  Read the inbound event as it arrived and decide which one of `billing`, `bug-report`,
  `how-to` or `account-access` it is. Emit the lane you picked on `lane` with the confidence
  you had in it, and emit the event on `routed` with its label added and payload and metadata
  otherwise untouched. If your confidence in the best label is below 0.6, route to the
  `general` lane instead of committing to a guess — every event leaves this node down some
  lane, because anything unrouted falls on the floor.
agent: Classifier
tools: []
params:
  labels:
    - billing
    - bug-report
    - how-to
    - account-access
  default_lane: general
  confidence_threshold: 0.6

inputs:
  - name: event
    type: json
    description: The inbound event as it arrived, payload and metadata untouched.
outputs:
  - name: lane
    type: status
    description: The lane the event was routed to, with the classifier's confidence attached.
  - name: routed
    type: json
    description: The event enriched with its label, ready for whichever branch picks it up.
dependencies:
  - ticket

requires_human: false
risk_markers: []
notes: >-
  The default lane is what stops anything falling on the floor. `labels` is configuration rather
  than an input port because a taxonomy belongs to the deployment, not to the event.

version: 1.0.0
author: hachi
ontology_version: 0.1.0
