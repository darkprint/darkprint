id: document-intake
name: Document Intake
type: tool

action: >-
  Open the run on a batch of unstructured source documents, stamp each one with its origin and
  content hash, and hand the batch downstream as the unit of work everything else is keyed to.
spec: >-
  Collect the source documents waiting in the intake location and open a run over them, in
  batches of at most 100 documents. For each document record three things — the origin path it
  came from, its full content, and a stable hash of that content — and emit the batch on
  `documents` as one entry per document. Use that hash as the document's identity for the rest
  of the run: bytes you have seen before must hash to the same value, because that is what lets
  a re-run land on the record already written instead of a second copy of it. You are done when
  every document in the intake location appears in exactly one emitted batch.
tools: []
mcp:
  - filesystem
skill: skills/document-intake.md
params:
  batch_size: 100

inputs: []
outputs:
  - name: documents
    type: json
    description: The batch, one entry per document, with its source path, content and hash.
dependencies: []
cannot:
  - emit the same document in two batches

requires_human: false
risk_markers: []
notes: >-
  The content hash is what makes a re-run idempotent: a document that arrives twice resolves to
  the same record key at the store and upserts over itself rather than duplicating.

version: 1.0.0
author: lupo
ontology_version: 0.1.0
