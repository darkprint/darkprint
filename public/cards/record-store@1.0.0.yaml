id: record-store
name: Record Store
type: tool
phase: deployment

action: >-
  Upsert the accepted records into the target store in batches keyed on the upsert key, and
  return the commit receipt, row counts, keys written, and the batch the run can resume from.
spec: >-
  Upsert the records arriving on `records` into the target table in batches of at most 500 rows,
  matching an existing row on `record_id` and inserting when no row matches. Commit each batch
  before you start the next one, so an interruption leaves whole batches written rather than
  half of one. Emit a commit receipt on `stored` naming the keys written, how many rows were
  inserted against how many updated, and the boundary of the last batch that committed. You are
  done when every record handed to you appears in that receipt exactly once; if a batch fails to
  commit, stop there and report the boundary it failed at rather than skipping past it.
tools:
  - sql
mcp:
  - postgres
skill: skills/record-store.md
params:
  upsert_key: record_id
  batch_size: 500

inputs:
  - name: records
    type: json
    description: Records the schema gate has already accepted; nothing unvalidated reaches this node.
outputs:
  - name: stored
    type: json
    description: The commit receipt, keys written, rows affected, and the batch boundary.
dependencies:
  - validate
cannot: []
will_not:
  - skip past a batch that failed to commit

risk_markers:
  - unchecked-write
notes: >-
  The write scope is the whole target table: the node can overwrite any row its upsert key
  resolves to. The schema gate immediately upstream is the only thing standing between a
  malformed record and a durable one, which is why the edge into this node is pinned to the
  gate's `accepted` port and never to `violations`, read `unchecked-write` here as a statement
  about the breadth of the write, not as a claim that nothing checks the records first.

version: 1.0.0
author: autogen
