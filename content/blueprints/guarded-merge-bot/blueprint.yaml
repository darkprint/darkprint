slug: guarded-merge-bot
title: Guarded Merge Bot
summary: >-
  An agent line triages the PR and drafts the review, iterating with the test runner until the
  suite is green. A maintainer approves before the merge lands.
description: |-
  Some factories are drawn with a person in them on purpose, and this is one of them. Five of the six nodes run unattended and the sixth is the maintainer, which is the shape the analyzer reads off the graph and reports as a conditional class. It is published for teams that want the review work done by agents and the merge decision made by a person they can name.

  This blueprint was generated automatically as an example for the registry.
