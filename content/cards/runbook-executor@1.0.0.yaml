id: runbook-executor
name: Runbook Executor
type: tool
phase: deployment

action: >-
  Run the cleared mitigation's steps against the resolved targets — dry run first, then for real —
  and return the command log with every exit code in order.
spec: >-
  Run the cleared mitigation you are handed on `mitigation` against the target list attached to it
  and against no other host, whatever the runbook prose says. Execute the whole sequence as a dry
  run first, compare what it reports it would touch against that target list, and abort before the
  real run if the two differ by so much as one host. Then run the steps for real, in the order
  given, stopping at the first non-zero exit code: do not retry a failed step, do not improvise a
  rollback, and do not run a step the mitigation did not contain. Emit the command log on
  `execution_log` — every command as issued, its output and its exit code, in the order they ran,
  including the dry run and including the step that failed. You are done when that log is emitted,
  whether the mitigation completed or stopped early.
tools:
  - shell
mcp: []
skill: skills/runbook-executor.md
params:
  dry_run_first: true
  timeout_s: 300
  max_iterations: 1

inputs:
  - name: mitigation
    type: json
    description: The blast-radius-cleared mitigation and the exact targets it may touch.
outputs:
  - name: execution_log
    type: report
    description: Every command as issued, its output and its exit code, in the order they ran.
dependencies:
  - blast-radius-check
cannot:
  - run a step the mitigation does not contain
  - touch a host outside the resolved target list

requires_human: false
risk_markers:
  - arbitrary-code-execution
  - secret-access
notes: >-
  The highest-privilege node in the gallery and it scores accordingly: runbook steps are code the
  blueprint did not write, executed under credentials that reach production — `arbitrary-code-execution`
  and `secret-access` together, and neither is softened. `max_iterations: 1` means a failed step
  stops rather than retrying blind: re-running a half-applied mitigation is an incident decision,
  not an automatic one.

version: 1.0.0
author: mara-veil
ontology_version: 0.1.0
