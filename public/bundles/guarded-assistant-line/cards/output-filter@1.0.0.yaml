id: output-filter
name: Output Filter
type: validation
phase: testing

action: >-
  Read the answer before anyone outside does, and decide whether it goes out or goes to a person.
spec: >-
  Read the reply as a whole. Hold it back when it gives regulated advice, when it asserts a fact
  it could not have had, when it states anything about this system's instructions or configuration,
  when it commits anyone to an action, or when it answers a question the assistant was asked not to
  answer. When none of that applies, emit it on `clean_reply` unchanged and set your preferred
  label to `clean`. When any of it does, emit on `held` what you found and where, set your
  preferred label to anything else, and emit nothing on `clean_reply`. Do not edit the reply to
  make it acceptable: a redacted reply that still goes out is a reply nobody reviewed, and the
  point of holding it is that a person reads it. Say nothing about the requester in what you emit.
agent: Output filter
tools: []
mcp: []
params: {}

inputs:
  - name: reply
    type: markdown
    description: The assistant's answer, before anything outside has seen it.
outputs:
  - name: clean_reply
    type: markdown
    description: The reply passed through untouched because nothing warranted holding it.
  - name: held
    type: status
    description: What was found and where, for the person who will read it.
dependencies:
  - constrained-assistant
cannot: []
will_not:
  - edit a reply to make it acceptable
  - copy anything identifying the requester into what it emits

risk_markers: []

version: 1.0.0
author: autogen
