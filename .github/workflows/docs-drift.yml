name: docs drift

# No GitHub Actions workflow existed in this repository yet, so this check runs on
# its own rather than being folded into an existing job.
#
# Non-blocking for now: `continue-on-error: true` lets the job fail red in the Actions
# UI without failing the check run or blocking a merge, while docs/ARCHITECTURE.md is
# still stabilizing and false positives are more costly than a missed drift. Once it
# has held steady for a while, drop `continue-on-error: true` so a failing check
# actually blocks the PR.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-docs-drift.mjs
        continue-on-error: true
