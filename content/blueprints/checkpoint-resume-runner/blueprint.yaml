slug: checkpoint-resume-runner
title: Checkpoint & Resume Runner
summary: >-
  A staged pipeline that snapshots state after every stage, so a failure at stage 3 resumes from
  the last good checkpoint instead of restarting the whole job.
description: |-
  Long agent jobs fail halfway, when a tool times out or a stage produces garbage. Each checkpoint records the stage's inputs, outputs and the decisions taken, and the resume node restores the most recent valid one when a downstream stage fails.

  That turns a brittle linear pipeline into one you can run unattended overnight. The verifier gates the final ship, and the checkpoint store doubles as an audit trail of exactly what each stage did.
