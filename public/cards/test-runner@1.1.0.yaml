id: test-runner
name: Test Runner
type: validation
phase: testing

action: >-
  Run the suites the review calls for against the PR head and gate on the result: green releases
  the report to the maintainer, red hands the failing cases back to the drafter for another pass.
spec: >-
  Read the drafted review you are handed, take the test suites it names, and run exactly those
  against the pull request's head ref, no more, no fewer. Give the whole run thirty minutes; a
  suite still executing when that expires counts as a failure, not as a pass. Emit `green` on
  `result` when every suite passes and `red` otherwise, carrying the failing-case count so the
  branch downstream can read the outcome without opening the write-up. Emit that write-up on
  `report`: suite names, durations, every failing case with its assertion and stack trace, and
  the coverage delta against the base ref. Do not edit the code, do not re-run a failing suite
  hoping for a different answer, and do not judge whether the change deserves to be merged.
model: claude-haiku-4-5
agent: Test runner
tools:
  - ci
  - git
mcp:
  - github
skill: skills/test-runner.md
params:
  timeout_s: 1800
  max_retries: 3

inputs:
  - name: review
    type: markdown
    description: The drafted review, which names the suites the change is expected to move.
outputs:
  - name: result
    type: status
    description: Green or red, plus the failing case count, the signal the red edge branches on.
  - name: report
    type: report
    description: The run write-up a maintainer reads, suites, durations, failures, coverage delta.
dependencies:
  - review-drafter
cannot: []
will_not:
  - edit the code under test
  - re-run a failing suite hoping for a different answer

risk_markers: []
notes: >-
  `max_retries: 3` bounds the draft/test loop at three attempts beyond the first, four runs of the
  suites in all. The number crosses over from `max_iterations` unchanged, and that is the point:
  nothing on this card promises a count of attempts, so re-reading it as engine spec §2.6's
  "additional attempts" leaves what a run does exactly where it already was. Drop it and the pair
  still terminates in practice, but the static analyzer has nothing to read and charges the
  blueprint for an unbounded loop.

version: 1.1.0
author: sol-antczak
