slug: producer-critic-refinery
title: Producer Critic Refinery
summary: >-
  A drafting line split in two: the node that writes the work never sees the rubric the work is
  graded against, and the node that holds the rubric never writes a word of it.
description: |-
  Two roots feed one judge. `rubric` states the criteria, `produce` writes a first draft, and
  `critique` is the only node that holds both. Everything the critic sends back is its own prose,
  never the criteria themselves, so the revision loop can run without ever handing the writing
  nodes the bar they are measured against.

  The separation is the whole blueprint. A writer that can read the rubric writes to the rubric,
  and the score stops meaning anything. Both `draft-producer` and `draft-reviser` therefore refuse
  `acceptance-criteria` outright, so the prohibition is a property of the bundle rather than a
  promise in prose: draw the missing edge and the bundle stops resolving.
