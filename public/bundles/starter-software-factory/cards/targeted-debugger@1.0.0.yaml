id: targeted-debugger
name: Targeted Debugger
type: agent
phase: debugging

action: >-
  Turn one run's failure evidence into the narrowest patch that addresses it, and stop once the
  attempt cap is spent or the evidence stops changing.
spec: >-
  You are given the evidence from a run that failed: the assertions that did not hold, the stack
  traces underneath them, and the expected value beside the one actually obtained. Find the
  smallest change to the existing source that accounts for those failures and emit it on `patch`
  a patch, not a rewrite, leaving every part of the code the evidence does not implicate
  exactly as it is. Do not special-case the literal values in the trace: a change that satisfies
  only the example in front of you has fixed nothing, and it will come straight back. Stop after
  three attempts, and stop earlier if two consecutive runs hand you the same evidence, that
  means you are circling, and another pass costs a round without buying information.
model: claude-opus-5
agent: Debugger
tools: []
mcp:
  - filesystem
skill: skills/targeted-debugger.md
params:
  max_iterations: 3

inputs:
  - name: evidence
    type: report
    description: One run's failure output, assertions, traces, expected beside obtained.
outputs:
  - name: patch
    type: code
    description: The narrowest change that accounts for the evidence, ready to be re-run.
dependencies:
  - acceptance-tester
cannot:
  - acceptance-criteria
will_not:
  - special-case the literal values in a trace

risk_markers: []
notes: >-
  `max_iterations: 3` is the declared cap for the `tester -> debugger -> tester` cycle, and it is
  load-bearing twice over. Drop it and doc 3 §4.1 charges the blueprint 1.5 for an unbounded
  loop. It also bounds a slower leak doc 2 §5.5 names: every iteration reveals another slice of
  the acceptance surface through the failure messages, so the cap limits how much of the criteria
  this node can reconstruct by accumulation. `acceptance-criteria` in `cannot` closes the fast
  version of the same leak. Doc 2 §5.5 hands this node the evidence of a failure and withholds
  the criteria themselves, and because that entry names a data type in the ontology the resolver
  enforces it: an edge carrying the criteria in raises `bundle/prohibition-violated`.

version: 1.0.0
author: orin
