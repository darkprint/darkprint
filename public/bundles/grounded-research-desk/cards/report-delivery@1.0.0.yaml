id: report-delivery
name: Report Delivery
type: tool
phase: deployment

action: >-
  Publish the grounded report to its reader with the citation trail intact, so every claim in it
  can be walked back to the passage that supports it.
spec: >-
  Publish the verified document on `report` to the `research-desk` destination, addressed to the
  person whose question opened the run. Carry the citation trail across unchanged: every sentence
  keeps the inline citation it arrived with, and the reference list keeps each source's identifier
  — URL, document id, or repository path and commit sha — together with the time it was retrieved,
  so a reader can walk any sentence back to the text behind it. Do not reorder, reword, shorten or
  reformat the content; you are delivering a verified artefact, not editing one. Publish exactly
  once, and only after the whole document and its reference list have arrived — once it has gone
  out it cannot be recalled or amended, so an incomplete input is a reason to stop, not to send a
  partial report.
tools: []
mcp:
  - filesystem
skill: skills/report-delivery.md
params:
  destination: research-desk
  include_citations: true

inputs:
  - name: report
    type: report
    description: The fact-checked report, as the verifier released it.
outputs: []
dependencies:
  - claim-verifier
cannot:
  - edit the report it delivers
  - publish before the reference list has arrived

requires_human: false
risk_markers:
  - irreversible-action

version: 1.0.0
author: orin
ontology_version: 0.1.0
