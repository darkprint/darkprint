# ============================================================
# DarkPrint content, local namespace extensions (doc 3 §7)
# Terms this release adds outside the curated core, layered over
# CORE_ONTOLOGY by `ontologyView(CORE_ONTOLOGY, terms)`.
#
# Doc 3 §7's three rules apply to everything in this file: `phase`
# is closed and may not be extended here, every term must declare a
# `broader` that reaches the core, and a risk marker without a
# weight counts 0 and moves no score. `OntologyView.validate()`
# enforces all three.
#
# A `version` key stood here, described as this overlay's own semver.
# It went on 2026-09-05 with ontology versioning itself: the owner
# asked the concept removed, because the vocabulary names what an
# Attractor node IS, Attractor fixes those shapes in its own spec
# and carries no vocabulary version, so a DarkPrint-only number on
# top was a second thing to keep in step with nothing. Nothing read
# this key even before that — `lib/content/ontology-file.ts` parses
# `terms` and never the version — so the line was already a claim
# with no reader, and the paragraph explaining it made two further
# claims that are false now: that a merged view keeps a version, and
# that a score is stamped with one.
#
# `since:` on a term below is NOT that key coming back. It is the
# release the term entered the vocabulary in, which is provenance and
# not a version of anything: nothing compares two of them and no page
# prints one. The parser still requires it, so a term added here says
# when it arrived. See `OntologyTerm.since` in `lib/core/ontology/types.ts`.
# ============================================================
terms:
  # Doc 3 §4 has no marker for personal data, and inventing a core
  # one would extend a curated set from the content side. Rooted at
  # `isolation-breach`: handling PII is information crossing a
  # boundary the topology was meant to hold, which is exactly what
  # that category names.
  - id: lupo/pii-handling
    kind: risk-marker
    label: PII handling
    description: The node reads, stores or passes on personal data that identifies a real person.
    broader: isolation-breach
    defaultWeight: 0.5
    since: "0.1.0"
